name: Build extension

on:
  push:
    branches: [nightly, stable]
    tags: ["v*"]
  pull_request:
    branches: [nightly, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version_name: ${{ steps.plan.outputs.version_name }}
      package_name: ${{ steps.plan.outputs.package_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan release channel
        id: plan
        run: node --experimental-strip-types scripts/release/plan.ts >> "$GITHUB_OUTPUT"
      - name: Require stable tags to belong to stable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.plan.outputs.channel == 'stable'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/stable; then
            echo '::error::Stable release tags must point to a commit on the stable branch.'
            exit 1
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code
        run: npm run check
      - name: Build extension
        run: npm run build
      - name: Label packaged version
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: node --experimental-strip-types scripts/release/plan.ts --label
      - name: Prepare ZIP
        id: package
        env:
          PACKAGE_NAME: ${{ needs.plan.outputs.package_name }}
        run: |
          NAME="$PACKAGE_NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p packages
          (cd dist && zip -q -r "../packages/${NAME}.zip" .)
      - name: Sign CRX
        if: github.event_name != 'pull_request'
        env:
          EXTENSION_SIGNING_KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          if [ -z "$EXTENSION_SIGNING_KEY" ]; then
            echo '::error::Configure the EXTENSION_SIGNING_KEY repository secret to build CRX.'
            exit 1
          fi
          umask 077
          KEY_PATH="$RUNNER_TEMP/extension-signing.pem"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s\n' "$EXTENSION_SIGNING_KEY" > "$KEY_PATH"
          unset EXTENSION_SIGNING_KEY
          google-chrome --headless=new --no-sandbox --no-message-box \
            --user-data-dir="$RUNNER_TEMP/extension-pack-profile" \
            --pack-extension="$GITHUB_WORKSPACE/dist" \
            --pack-extension-key="$KEY_PATH"
          test -s dist.crx
          mv dist.crx "packages/${PACKAGE_NAME}.crx"
      - name: Verify packages
        run: python3 scripts/release/verify-packages.py
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          echo "## Extension packages" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **${PACKAGE_NAME}** from this run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          echo 'The ZIP contains manifest.json at its root. Extract it to load unpacked in Chrome or Edge.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Trusted builds also include a CRX signed with the stable repository signing key.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && needs.plan.outputs.channel == 'stable' && needs.plan.outputs.release == 'true' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    needs: [plan, build, e2e]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package_name }}
          path: packages
      - name: Check Chrome Web Store credentials
        id: creds
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ]; then
            echo '::warning::Chrome Web Store secrets not fully configured; skipping store publish.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload ZIP and submit for review
        if: steps.creds.outputs.present == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          ZIP=$(ls packages/*.zip | head -n 1)
          npx --yes chrome-webstore-upload-cli@4 --source "$ZIP"

  e2e:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build extension
        run: npm run build
      - name: Run end-to-end tests
        run: npm test

  release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package_name }}
          path: packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          可自由整理的新标签页，包含常用网站、文件夹、搜索和实用小组件。

          下载 ZIP，解压后在 Chrome / Edge 扩展管理页开启开发者模式，选择「加载已解压的扩展程序」。
          CRX 使用固定密钥签名；浏览器可能限制商店外 CRX 安装。
          NOTES
          if [ "$RELEASE_CHANNEL" = nightly ]; then
            echo '' >> release-notes.md
            echo 'Nightly 预发布版本，仅通过 GitHub Release 分发，不提交 Chrome Web Store。' >> release-notes.md
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--verify-tag --latest)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" packages/* --target "$GITHUB_SHA" \
              --title "Oh My Tab $RELEASE_VERSION_NAME" --notes-file release-notes.md "${FLAGS[@]}"
          fi
