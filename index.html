<!doctype html>
<html>
  <!--
    The runtime owns <html lang> and <title> for this entry: `startLanguageSync`
    applies the persisted `omt.locale` preference after hydration, so neither is
    pinned to a language here. Brand metadata that reads the same in every
    language is kept; the prose tags (`description`, `og:locale`,
    `og:description`, `twitter:description`) were language-bound and are gone.
    Localized name and description live in `public/_locales/`, which the browser
    applies to the manifest rather than to extension pages.
  -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oh My Tab" />
    <meta property="og:title" content="Oh My Tab" />
    <meta name="twitter:card" content="summary" />
    <title>Oh My Tab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
