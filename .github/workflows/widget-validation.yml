name: Temporary widget validation

on:
  push:
    branches: [feat/expanded-widget-library]
    paths: [.github/workflows/widget-validation.yml]

permissions:
  contents: write

concurrency:
  group: widget-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'trynewthin/oh-my-tab' && github.ref == 'refs/heads/feat/expanded-widget-library'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format only files changed by this feature
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { writeFileSync } from 'node:fs'
          const base = '4064163c7cb13641d926eb38f7e64df8453dac0c'
          const paths = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', '-z', base, 'HEAD'], {encoding: 'utf8'})
            .split('\0').filter(p => p && !p.startsWith('.github/') && /\.(js|mjs|ts|tsx|json|css|md|yml|yaml)$/.test(p))
          if (paths.length) execFileSync('node', ['node_modules/prettier/bin/prettier.cjs', '--write', ...paths], {stdio: 'inherit'})
          writeFileSync(process.env.RUNNER_TEMP + '/widget-format-paths.json', JSON.stringify(paths))
          NODE
      - name: Commit formatting to the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/feat/expanded-widget-library'
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const paths = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/widget-format-paths.json', 'utf8'))
          if (paths.length) execFileSync('git', ['add', '--', ...paths], {stdio: 'inherit'})
          NODE
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format expanded widget implementation'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/expanded-widget-library
          fi
      - name: Formatting
        if: success() || failure()
        run: npm run format:check
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: TypeScript
        if: success() || failure()
        run: npm run typecheck
      - name: Architecture
        if: success() || failure()
        run: npm run verify:architecture
      - name: Unit tests only
        if: success() || failure()
        run: npm run test:unit
      - name: Build extension
        if: success() || failure()
        run: npm run build
      - name: Build website
        if: success() || failure()
        run: npm run website:build
      - name: Archive exact validated source
        if: always()
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/widget-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-validation-source
          path: ${{ runner.temp }}/widget-source.zip
          retention-days: 1
          if-no-files-found: error
