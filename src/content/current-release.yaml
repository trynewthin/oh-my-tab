version: 1.5.7
notes:
  zh-CN:
    - 网格支持缩放（60%–200%，默认 100%），组件列数扩展到 1–10，大屏不再空出一截。
    - 新增星轨材质预览，材质设置更简洁。
    - 标签动效可设置覆盖范围。
    - 修复下班倒计时进度行位置偏高的问题。
  en:
    - Grid scaling (60%–200%, default 100%) and 1–10 component columns, so large screens are filled.
    - Added a star trail material preview and simplified material settings.
    - Tab effect coverage is now configurable.
    - Fixed the clock-out countdown progress row sitting too high.
