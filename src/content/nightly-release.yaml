version: 1.6.0
notes:
  zh-CN:
    - 在浏览器扩展的「个性化」中，「主页」下方新增 Popup 外观。可实时预览和调整工具栏弹窗的宽度、内边距、背景效果、颜色与动画。设置随工作区备份保存。
  en:
    - The browser extension adds Popup appearance below Home in Personalization. Preview and adjust the toolbar popup’s width, padding, background effect, color, and animation. These settings are included in workspace backups.
