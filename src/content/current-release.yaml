version: 1.5.9
notes:
  zh-CN:
    - 在扩展和网站中启用 React Compiler，减少不必要的重渲染，提升整体响应速度。
    - 批量选择支持框选与批量拖拽移动，对话框按需加载，操作更轻快。
    - 优化文件夹收合过渡动画，经典文件夹的光效质感与运动更细腻流畅。
    - 改进搜索编辑与弹层退出过渡，统一编辑面板背景模糊与文件夹阴影表现。
  en:
    - Enabled React Compiler across the extension and website to cut unnecessary re-renders and improve responsiveness.
    - Bulk selection now supports marquee selection and drag-to-move for groups, with dialogs loaded on demand.
    - Smoothed folder collapse transitions and refined classic folder glow textures and motion.
    - Polished search editing and popover exit transitions, and unified the editor backdrop blur with folder shadows.
