version: 1.5.8
notes:
  zh-CN:
    - 新增快捷坞，集中放置常用操作和网页。
    - 组件支持就近编辑和拖动调整大小。
    - 丰富标签外观设置，长条与方形可分别调整，组件圆角统一管理。
    - 优化拖拽与过渡动画。
  en:
    - Added shortcut docks for frequently used actions and websites.
    - Edit components in place and drag to resize them.
    - Expanded tab appearance settings, with separate styles for rectangular and square tabs and shared component corners.
    - Improved dragging and transitions.
