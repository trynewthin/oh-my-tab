version: 1.5.6
notes:
  zh-CN:
    - 新增同步快照，随时找回历史版本。
    - 修复 WebDAV 连接信息丢失及部分同步失败的问题。
    - 标签图标支持上传和裁剪。
    - 标签动效支持批量开关，也可设置新标签的默认动效。
    - 新增材质预览，试试不同的背景效果。
  en:
    - Added sync snapshots to restore previous versions.
    - Fixed lost WebDAV connection details and several sync failures.
    - Upload and crop your own tab icons.
    - Toggle effects for all tabs and set the default for new tabs.
    - Try different background effects in the new material preview.
